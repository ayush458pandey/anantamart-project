# Cloudflare Worker Configuration for Anantamart
# Hybrid Architecture: Cloudflare (CDN/Security/Edge) + Cloudinary (Media)

name = "anantamart-hybrid"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables (set in Cloudflare dashboard)
[vars]
ENVIRONMENT = "production"
CLOUDINARY_CLOUD_NAME = "dge0dtvzc"
CLOUDINARY_BASE_URL = "https://res.cloudinary.com/dge0dtvzc/image/upload"
API_BASE_URL = "https://api.ananta-mart.in/api"
FRONTEND_URL = "https://ananta-mart.in"

# KV Namespace for edge caching (create with: wrangler kv:namespace create "EDGE_CACHE")
[[kv_namespaces]]
binding = "EDGE_CACHE"
id = "your-kv-namespace-id-here"
preview_id = "your-preview-kv-namespace-id-here"

# R2 Bucket for static assets backup (create with: wrangler r2 bucket create anantamart-static)
[[r2_buckets]]
binding = "STATIC_BUCKET"
bucket_name = "anantamart-static"
preview_bucket_name = "anantamart-static-preview"

# Durable Object for rate limiting (optional)
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Triggers
[triggers]
crons = ["0 * * * *"]  # Hourly cache warming

# Build configuration
[build]
command = "npm run build"
watch_dir = "src"

# Pages configuration
[pages]
build = "npm run build"

[pages.routes]
include = ["/*"]
exclude = ["/api/*", "/static/*"]

# Analytics
[analytics]
enabled = true