# =============================================================================
# ANANTAMART - Backend Deploy to Render
# =============================================================================
# Triggers: Push to deployment-setup (backend changes), Manual dispatch (with branch input)
# =============================================================================

name: Backend Deploy to Render

on:
  push:
    branches: [deployment-setup]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: deployment-setup)'
        required: false
        default: 'deployment-setup'
        type: choice
        options:
          - deployment-setup
          - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements/

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/testing.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing

      - name: Run linting
        run: |
          pip install flake8
          flake8 apps/ config/ --max-line-length=120 --ignore=E501,W503

  build-and-deploy:
    name: Build and Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.branch == 'deployment-setup'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: render/deploy-action@v1
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true
          timeout: 600

  notify:
    name: Notify on Failure
    needs: [test, build-and-deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "Deployment failed! Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here