# =============================================================================
# ANANTAMART - Backend Manual Deploy to Render
# =============================================================================
# Automatic deploys are handled by Render itself, not by this workflow. All
# three backend services use `autoDeployTrigger: checksPass` in render.yaml, so
# Render deploys `deployment-setup` only after `Backend CI` passes.
#
# The primary manual path is the Render Dashboard: service -> Manual Deploy.
# It needs no secret and no workflow. This workflow is an OPTIONAL alternative
# for when CI is unavailable or a deploy must be re-triggered from GitHub; it
# re-runs the test suite first so it cannot bypass the gate.
#
# Optional secrets, one per service (Render -> service -> Settings -> Deploy Hook):
#   RENDER_DEPLOY_HOOK_API     -> anantamart-api
#   RENDER_DEPLOY_HOOK_WORKER  -> anantamart-worker
#   RENDER_DEPLOY_HOOK_BEAT    -> anantamart-beat
# =============================================================================

name: Backend Manual Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a production deploy'
        required: true
        type: string

concurrency:
  group: backend-manual-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements/

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/testing.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing

  deploy:
    name: Deploy to Render
    needs: test
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger anantamart-api deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "${HOOK_URL}" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_API is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          # --fail-with-body turns Render's 400/401/404/409 into a failed step
          # instead of a silent success. 200 = started, 202 = queued.
          curl --fail-with-body -sS -X POST "${HOOK_URL}"
          echo "Deploy triggered for anantamart-api"

      - name: Trigger anantamart-worker deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
        run: |
          if [ -z "${HOOK_URL}" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_WORKER is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          # --fail-with-body turns Render's 400/401/404/409 into a failed step
          # instead of a silent success. 200 = started, 202 = queued.
          curl --fail-with-body -sS -X POST "${HOOK_URL}"
          echo "Deploy triggered for anantamart-worker"

      - name: Trigger anantamart-beat deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_BEAT }}
        run: |
          if [ -z "${HOOK_URL}" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_BEAT is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          # --fail-with-body turns Render's 400/401/404/409 into a failed step
          # instead of a silent success. 200 = started, 202 = queued.
          curl --fail-with-body -sS -X POST "${HOOK_URL}"
          echo "Deploy triggered for anantamart-beat"

  notify:
    name: Notify on Failure
    needs: [test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "Deployment failed! Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here
